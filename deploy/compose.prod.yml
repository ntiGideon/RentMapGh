# Single-VPS production/staging stack. Secrets come from deploy/.env.prod
# (not committed). Deploy:
#   docker compose -f deploy/compose.prod.yml --env-file deploy/.env.prod run --rm migrate
#   docker compose -f deploy/compose.prod.yml --env-file deploy/.env.prod up -d
name: rentmap

x-web-env: &web-env
  APP_ENV: ${APP_ENV:-production}
  BASE_URL: ${BASE_URL:?set BASE_URL}
  DATABASE_URL: postgres://rentmap:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/rentmap?sslmode=disable
  TRUST_PROXY: "true"
  LOG_LEVEL: info
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
  DOCUMENT_KEY: ${DOCUMENT_KEY:?set DOCUMENT_KEY}
  LOCATION_SECRET: ${LOCATION_SECRET:?set LOCATION_SECRET}
  STORAGE_DIR: /data/private
  # Listing photos: the media volume by default; set MEDIA_STORE=s3 and the
  # S3_* variables for Cloudflare R2 (S3_REGION=auto) or Garage.
  MEDIA_STORE: ${MEDIA_STORE:-disk}
  MEDIA_DIR: /data/media
  # Walk-through video uploads are assembled and transcoded here (one web
  # replica per inbox; the originals never leave it).
  VIDEO_INBOX_DIR: /data/inbox
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  SMS_PROVIDER: ${SMS_PROVIDER:-africastalking}
  SMS_SENDER_ID: ${SMS_SENDER_ID:-RentMap}
  AT_USERNAME: ${AT_USERNAME:?set AT_USERNAME}
  AT_API_KEY: ${AT_API_KEY:?set AT_API_KEY}
  AT_SANDBOX: ${AT_SANDBOX:-false}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-} # shown on the help and legal pages
  SENTRY_DSN: ${SENTRY_DSN:-} # optional: errors and panics to Sentry
  RELEASE: ${RELEASE:-} # e.g. the git SHA; tags Sentry events

services:
  db:
    image: ${DB_IMAGE:-rentmap/postgres:17-postgis-pgvector}
    restart: unless-stopped
    environment:
      POSTGRES_USER: rentmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: rentmap
    # tini as PID 1: pgBackRest's async archiver leaves orphans behind, and if
    # the postmaster were PID 1 it would reap them, take a non-zero exit for a
    # crashed backend and restart the whole database.
    init: true
    # Off-site pgBackRest repo (R2); optional, see deploy/pgbackrest.env.example.
    env_file:
      - path: ./.env.pgbackrest
        required: false
    # WAL archiving for point-in-time recovery. Until `deploy/backup/pitr.sh
    # setup` has run once, archiving fails and Postgres keeps retrying (logs
    # only; the site is unaffected).
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=rentmap archive-push %p
      - -c
      - archive_timeout=300 # a quiet database still ships WAL every 5 min
      - -c
      - max_wal_size=2GB
    volumes: [pgdata:/var/lib/postgresql/data, pgbackrest:/var/lib/pgbackrest]
    healthcheck:
      # Over TCP: on a fresh volume the init scripts run on a socket-only
      # temporary server first, which must not count as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rentmap -d rentmap"]
      interval: 5s
      retries: 20

  # One-off job, run before rolling out a new web image.
  migrate:
    image: ${WEB_IMAGE:-rentmap/web:latest}
    entrypoint: ["/app/migrate", "up"]
    environment: *web-env
    depends_on: { db: { condition: service_healthy } }
    profiles: [tools]

  web:
    image: ${WEB_IMAGE:-rentmap/web:latest}
    restart: unless-stopped
    environment: *web-env
    depends_on: { db: { condition: service_healthy } }
    expose: ["8080"]
    volumes: [uploads:/data/private, media:/data/media, inbox:/data/inbox]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  pgdata: {}
  pgbackrest: {} # WAL archive + base backups (repo1); off-site copy is repo2
  uploads: {} # back this up with the database; evidence is useless without DOCUMENT_KEY
  media: {} # listing photos when MEDIA_STORE=disk; back it up with the database
  inbox: {} # video uploads in progress; safe to lose (listers re-upload)
  caddy_data: {}
  caddy_config: {}
