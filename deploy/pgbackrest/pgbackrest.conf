# pgBackRest for the production database (point-in-time recovery).
# repo1 is the pgbackrest volume on the server. An off-site, encrypted repo2
# (Cloudflare R2 or any S3) is switched on by deploy/.env.pgbackrest — see
# deploy/pgbackrest.env.example. Run commands as the postgres OS user:
#   docker exec -u postgres <db> pgbackrest --stanza=rentmap info
# or use deploy/backup/pitr.sh.

[global]
repo1-path=/var/lib/pgbackrest
# Time-based: keep enough full backups to recover to any moment in the last
# 23 days. With weekly fulls the oldest data held is then at most 30 days
# old, which is what the privacy policy promises.
repo1-retention-full-type=time
repo1-retention-full=23

compress-type=zst
process-max=2
start-fast=y
log-level-console=info
log-level-file=off

# Push WAL in the background. If the repos can't be reached (e.g. R2 is
# down) WAL piles up in pg_wal; past 4 GiB pgBackRest drops it instead of
# filling the disk — that leaves a gap in point-in-time recovery (the next
# backup closes it) but keeps the site up. pitr.sh check alerts on it.
archive-async=y
spool-path=/var/spool/pgbackrest
archive-push-queue-max=4GiB

[rentmap]
pg1-path=/var/lib/postgresql/data
# The image's superuser is POSTGRES_USER (there is no postgres role).
pg1-user=rentmap
