name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        # Same PostGIS base as dev; pgvector is installed in the next step.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: rentmap
          POSTGRES_PASSWORD: rentmap
          POSTGRES_DB: rentmap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rentmap" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://rentmap:rentmap@localhost:5432/rentmap_test?sslmode=disable
      TEST_S3_ENDPOINT: http://localhost:8333
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }

      - name: Install pgvector in the service container
        run: |
          id=$(docker ps -q --filter "ancestor=postgis/postgis:17-3.5")
          docker exec "$id" bash -c "apt-get update -qq && apt-get install -y -qq postgresql-17-pgvector"

      # Service containers can't take a command, so SeaweedFS (S3) starts here.
      - name: Start SeaweedFS
        run: |
          docker run -d --name s3 -p 8333:8333 -v "$PWD/deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:3.97 server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=64 -volume.max=100
          for i in $(seq 1 60); do curl -sf http://localhost:8333/healthz && break; sleep 1; done

      - name: Generated code is up to date (templ, Ent)
        run: |
          go tool templ generate
          go generate ./internal/ent
          git diff --exit-code -- '*_templ.go' internal/ent

      - name: Build CSS
        run: |
          curl -sSfL -o /usr/local/bin/tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          chmod +x /usr/local/bin/tailwindcss
          tailwindcss -i web/css/app.css -o web/static/css/app.css --minify

      - run: go vet ./...
      - run: go test -race -p 1 -timeout 5m ./... # packages share the test DB
      - run: go build ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go tool templ generate
      - uses: golangci/golangci-lint-action@v8
        with: { version: latest }

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
